<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>程序分析</title><link rel="stylesheet" href="/style.css"><script src="/local-ui.js?v=20261116-unresolved-intent" defer></script></head>
<body><main class="analysis-main"><header><h1>程序分析</h1><a href="/">返回数据采集</a></header>
<p>从采集记录中识别机会、归纳主题、评估价值并整理立项策划。</p>

<section class="panel"><h2>选择已采集批次</h2><label>研究批次<select id="batch"></select></label><p id="batch-info"></p>
<form id="run-form"><details><summary>设置下一次分析参数（默认可直接运行）</summary><div class="grid-form"><label>方向词（逗号分隔，留空按需求方向匹配）<input id="direction-terms" maxlength="2000" placeholder="例如：会议,meeting,minutes"></label>
<label>规则阈值<input id="threshold" type="number" value="0.7" min="0" max="1" step="0.05" required></label>
<label>机会评分方法<select id="score-method"><option value="evidence_strength">证据强度</option><option value="completeness">条件完整性</option></select></label>
<label>文本向量方法<select id="vector-method"><option value="lsa">LSA 潜在语义</option><option value="tfidf">TF-IDF 词面向量</option><option value="e5">E5多语言句向量（需本地模型）</option></select></label>
<label>E5 距离阈值（仅E5生效）<input id="semantic-distance" type="number" value="0.15" min="0.01" max="0.8" step="0.01" required></label>
<label>聚类距离阈值（越大越容易合并）<input id="distance" type="number" value="0.65" min="0.05" max="1.5" step="0.05" required></label>
<label>聚类方式<select id="cluster-mode"><option value="flat">统一聚类</option><option value="function_then_text">按功能分组后聚类</option></select></label>
<label class="check"><input id="semantic-recall" type="checkbox">显示语义扩展线索（需本地E5文件）</label>
<label>语义线索相似度阈值<input id="recall-threshold" type="number" value="0.85" min="0.5" max="1" step="0.01" required></label>
<label>LSA 最大维数<input id="dimensions" type="number" value="32" min="2" max="128" required></label>
<label>来源覆盖权重<input id="coverage" type="number" value="0.6" min="0" max="1" step="0.05" required></label>
<label>记录规模权重<input id="scale" type="number" value="0.4" min="0" max="1" step="0.05" required></label>
</div></details><button id="start" disabled>开始程序分析</button></form>
<p class="hint">每次运行保留独立分析记录，使用所选批次已采集的完整文本。显式填写方向词时仅按这些词筛选；留空可匹配已知办公/行业词典，未识别的限定方向不自动放宽。不会重新采集数据。更换需求应返回主页新建采集批次。</p>
<p id="notice" role="status" aria-live="polite"></p><label>本批次分析历史<select id="runs"></select></label></section>
<section id="result" class="panel"><p>请选择批次并开始分析，或查看已有本地分析。</p></section></main></body></html>
